  <style>
    :root {
      /* Default Accent Theme: Cyan-Blue (Ocean Fintech) */
      --accent-from: #06B6D4;
      --accent-to: #3B82F6;
      --accent-solid: #06B6D4;
      --accent-secondary: #3B82F6;
      --accent-glow: rgba(6, 182, 212, 0.28);
      --accent-soft: rgba(6, 182, 212, 0.14);
      --accent-border: rgba(6, 182, 212, 0.35);
    }

    /* Accent Theme 2: Electric Violet (Revolut Style) */
    [data-accent="violet"] {
      --accent-from: #6366F1;
      --accent-to: #A855F7;
      --accent-solid: #8B5CF6;
      --accent-secondary: #6366F1;
      --accent-glow: rgba(139, 92, 246, 0.30);
      --accent-soft: rgba(139, 92, 246, 0.15);
      --accent-border: rgba(168, 85, 247, 0.38);
    }

    /* Accent Theme 3: Emerald Mint */
    [data-accent="emerald"] {
      --accent-from: #10B981;
      --accent-to: #059669;
      --accent-solid: #10B981;
      --accent-secondary: #059669;
      --accent-glow: rgba(16, 185, 129, 0.28);
      --accent-soft: rgba(16, 185, 129, 0.14);
      --accent-border: rgba(16, 185, 129, 0.38);
    }

    /* Accent Theme 4: Sunset Coral */
    [data-accent="coral"] {
      --accent-from: #F43F5E;
      --accent-to: #FB923C;
      --accent-solid: #F43F5E;
      --accent-secondary: #FB923C;
      --accent-glow: rgba(244, 63, 94, 0.28);
      --accent-soft: rgba(244, 63, 94, 0.14);
      --accent-border: rgba(244, 63, 94, 0.38);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      max-width: 100vw;
      overflow-x: hidden;
      font-family: 'Vazirmatn', sans-serif;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    .dir-ltr {
      direction: ltr;
    }

    /* =====================================================
       1. DARK MIDNIGHT GLASS (Default Mode)
       ===================================================== */
    html.dark body {
      background-color: #0B0F19;
      background-image:
        radial-gradient(circle at 12% 10%, var(--accent-glow), transparent 38%),
        radial-gradient(circle at 88% 82%, rgba(59, 130, 246, 0.14), transparent 42%),
        linear-gradient(180deg, #0B0F19 0%, #0F172A 100%);
      background-attachment: fixed;
      color: #F1F5F9;
    }

    html.dark .glass-card {
      background: rgba(30, 41, 59, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.45);
    }

    html.dark .glass-subcard {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    html.dark .glass-header {
      background: rgba(11, 15, 25, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    html.dark .glass-input {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #F8FAFC;
    }
    html.dark .glass-input:focus {
      border-color: var(--accent-solid);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    html.dark .glass-modal {
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* =====================================================
       2. SOFT FROST SLATE (Soft Light Mode - NO #FFFFFF)
       ===================================================== */
    html:not(.dark) body {
      background-color: #DCE4EE;
      background-image:
        radial-gradient(circle at 10% 10%, var(--accent-glow), transparent 36%),
        radial-gradient(circle at 90% 85%, rgba(99, 102, 241, 0.12), transparent 40%),
        linear-gradient(180deg, #DCE4EE 0%, #E2E8F0 100%);
      background-attachment: fixed;
      color: #0F172A;
    }

    html:not(.dark) .glass-card {
      background: rgba(238, 242, 246, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(15, 23, 42, 0.09);
      box-shadow: 0 12px 32px -10px rgba(15, 23, 42, 0.08);
    }

    html:not(.dark) .glass-subcard {
      background: rgba(226, 232, 240, 0.78);
      border: 1px solid rgba(15, 23, 42, 0.08);
    }

    html:not(.dark) .glass-header {
      background: rgba(226, 232, 240, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(15, 23, 42, 0.09);
    }

    html:not(.dark) .glass-input {
      background: #E2E8F0;
      border: 1px solid rgba(15, 23, 42, 0.15);
      color: #0F172A;
    }
    html:not(.dark) .glass-input:focus {
      border-color: var(--accent-solid);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    html:not(.dark) .glass-modal {
      background: #EEF2F6;
      border: 1px solid rgba(15, 23, 42, 0.14);
    }

    /* Dynamic Accent Utilities */
    .btn-accent {
      background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
      color: #F8FAFC;
      box-shadow: 0 8px 22px -5px var(--accent-glow);
      transition: all 0.22s ease;
    }
    .btn-accent:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 12px 26px -4px var(--accent-glow);
    }
    .btn-accent:active {
      transform: translateY(0) scale(0.98);
    }

    .accent-text {
      color: var(--accent-solid);
    }

    .accent-badge {
      background: var(--accent-soft);
      color: var(--accent-solid);
      border: 1px solid var(--accent-border);
    }

    .accent-hero {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.92) 0%, rgba(30, 41, 59, 0.88) 55%, var(--accent-soft) 100%);
      border: 1px solid var(--accent-border);
      box-shadow: 0 20px 45px -15px var(--accent-glow);
    }

    html:not(.dark) .accent-hero {
      background: linear-gradient(135deg, #1E293B 0%, #0F172A 65%, var(--accent-to) 140%);
      color: #F8FAFC;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent-solid);
      border-radius: 999
